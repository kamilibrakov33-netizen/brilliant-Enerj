<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>НПС «Сулак» — 3D-схема 3069-ЭС</title>
<style>
:root{
  --bg:#eef0f3; --panel:#ffffff; --ink:#1b1f24; --muted:#5d6672; --line:#dfe3e8;
  --accent:#0b5cad; --accent-soft:#e6f0fa; --warn:#a15c00; --warn-soft:#fff3e0;
  --ok:#1f7a3f; --ok-soft:#e8f5ec; --sel:#ff7a00;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:14px/1.45 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#app{display:grid;grid-template-columns:400px 1fr;height:100vh}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
header{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
header .code{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.04em}
header h1{font-size:17px;margin:2px 0 4px;line-height:1.25}
header .sub{font-size:12px;color:var(--muted)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.pane{overflow:auto;flex:1;min-height:0;padding:10px 12px 20px;display:none}
.pane.on{display:block}
.stage{margin:12px 4px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.item{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.item:hover{background:#f5f7f9}
.item.on{background:var(--accent-soft);border-color:#bcd5ee}
.item .n{flex:none;width:24px;height:24px;border-radius:6px;background:#eef1f4;color:var(--muted);font-size:12px;display:grid;place-items:center;font-weight:600}
.item.on .n{background:var(--accent);color:#fff}
.item .t{font-weight:600;font-size:13px}
.item .q{font-size:12px;color:var(--muted)}
.item .flag{color:var(--warn);font-size:11px;font-weight:600}
.q-card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}
.q-card b{display:block;margin-bottom:2px}
.q-card span{color:var(--muted);font-size:13px}
.about p{margin:8px 4px}
.about li{margin:3px 0}
#view{position:relative;min-width:0}
canvas{display:block}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-120%);background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:5px;
  padding:1px 6px;font-size:11px;white-space:nowrap;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lb.sel{background:var(--sel);color:#fff;border-color:var(--sel);font-weight:600}
#card{position:absolute;right:14px;top:14px;width:380px;max-height:calc(100% - 90px);overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:14px 16px;display:none}
#card.on{display:block}
#card .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
#card h2{font-size:16px;margin:0 22px 4px 0;line-height:1.3}
#card .meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{font-size:11px;padding:2px 7px;border-radius:999px;background:#eef1f4;color:#38414b}
.blk{border-radius:8px;padding:8px 10px;margin:8px 0}
.blk h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px}
.blk ul{margin:0;padding-left:18px}
.blk li{margin:2px 0}
.blk.p{background:var(--accent-soft)} .blk.p h3{color:var(--accent)}
.blk.a{background:var(--warn-soft)} .blk.a h3{color:var(--warn)}
.blk.w{background:#fdecea} .blk.w h3{color:#b3261e}
.blk.d{background:#f3f5f7} .blk.d h3{color:var(--muted)}
#bar{position:absolute;left:14px;bottom:14px;right:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
#bar>*{pointer-events:auto}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.seg button{border:0;background:none;padding:7px 10px;font:inherit;font-size:12px;cursor:pointer;color:var(--ink);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.seg .lbl{padding:7px 10px;font-size:12px;color:var(--muted);border-right:1px solid var(--line)}
#hint{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted)}
#cap{position:absolute;left:0;right:0;bottom:0;padding:22px 34px 26px;background:linear-gradient(to top,rgba(10,22,34,.92),rgba(10,22,34,.78) 70%,rgba(10,22,34,0));color:#fff}
#cap .ct{font-size:34px;font-weight:700;line-height:1.15;margin-bottom:8px}
#cap .c1,#cap .c2{font-size:24px;line-height:1.35}
#cap .c2{color:#ffd28a}
#cap .c3{font-size:17px;color:#b9c7d3;margin-top:6px}
#tip{position:absolute;pointer-events:none;background:#1b1f24;color:#fff;font-size:12px;padding:3px 8px;border-radius:5px;display:none;white-space:nowrap}
@media (max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:55vh 45vh}
  #view{grid-row:1} #side{grid-row:2;border-right:0;border-top:1px solid var(--line)}
  #card{left:8px;right:8px;width:auto;top:8px;max-height:calc(100% - 70px)}
  #hint{display:none}
  .seg button{padding:6px 7px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <div class="code">3069-ЭС · ЭЛЕКТРОСНАБЖЕНИЕ</div>
      <h1>НПС «Сулак». Заглублённый склад с резервным МДП</h1>
      <div class="sub" id="who"></div>
    </header>
    <div class="tabs">
      <button class="on" data-p="works">Работы</button>
      <button data-p="qs">Вопросы <span id="qn"></span></button>
      <button data-p="about">О схеме</button>
    </div>
    <div class="pane on" id="works"></div>
    <div class="pane" id="qs"></div>
    <div class="pane about" id="about"></div>
  </aside>
  <main id="view">
    <div id="labels"></div>
    <div id="hint">Вращение — левая кнопка мыши · сдвиг — правая · масштаб — колесо · клик по элементу открывает карточку</div>
    <div id="card"><button class="x" aria-label="Закрыть">×</button><div id="cardBody"></div></div>
    <div id="tip"></div>
    <div id="cap" hidden><div class="ct"></div><div class="c1"></div><div class="c2"></div><div class="c3"></div></div>
    <div id="bar">
      <div class="seg" id="views">
        <span class="lbl">Вид</span>
        <button data-v="all" class="on">Общий</button>
        <button data-v="in">Внутри</button>
        <button data-v="trench">Траншея</button>
        <button data-v="road">Дорога</button>
        <button data-v="drop">Эстакада</button>
        <button data-v="ground">Заземление</button>
      </div>
      <div class="seg" id="stagesSeg"><span class="lbl">Этап до</span></div>
      <div class="seg" id="layers">
        <button data-l="soil" class="on">Грунт</button>
        <button data-l="roof" class="on">Перекрытие</button>
        <button data-l="labels" class="on">Подписи</button>
      </div>
    </div>
  </main>
</div>
<!--DATA-->
<!--THREE-->
<script>
(function(){
const D = window.SULAK, M = D.meta;
document.getElementById('who').textContent = 'Подрядчик: ' + M.contractor + ' · Генподрядчик: ' + M.general + ' · Заказчик: ' + M.customer;

// ---------------- scene ----------------
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9edf1);
const camera = new THREE.PerspectiveCamera(42, 1, 0.05, 600);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a66, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.position.set(-30, 50, 25); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.25); fill.position.set(30, 10, -30); scene.add(fill);

const tagMeshes = {};      // tag -> meshes
const stageOf = {};        // tag -> stage
D.items.forEach(i => stageOf[i.id] = i.stage);
const layer = {soil:[], roof:[]};
const pickables = [];
const labels = [];

function reg(mesh, tag, opts){
  opts = opts || {};
  if (tag){ (tagMeshes[tag] = tagMeshes[tag] || []).push(mesh); mesh.userData.tag = tag; pickables.push(mesh); }
  if (opts.layer) layer[opts.layer].push(mesh);
  scene.add(mesh); return mesh;
}
function mat(color, o){
  o = o || {};
  return new THREE.MeshStandardMaterial(Object.assign({color, roughness:.75, metalness:.05}, o));
}
function box(w,h,d,x,y,z,color,tag,o){
  o = o || {};
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), o.material || mat(color, o.m));
  m.position.set(x,y,z); if (o.ry) m.rotation.y = o.ry;
  return reg(m, tag, o);
}
const UP = new THREE.Vector3(0,1,0);
function seg(a,b,r,color,tag,o){
  o = o || {};
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
  const len = A.distanceTo(B); if (len < 1e-4) return;
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,o.rs||12), o.material || mat(color, o.m));
  m.position.copy(A).add(B).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(UP, B.clone().sub(A).normalize());
  return reg(m, tag, o);
}
function poly(pts,r,color,tag,o){
  const material = mat(color, (o&&o.m)||{});
  for (let i=0;i<pts.length-1;i++) seg(pts[i],pts[i+1],r,color,tag,Object.assign({},o,{material}));
  for (let i=1;i<pts.length-1;i++){
    const s = new THREE.Mesh(new THREE.SphereGeometry(r,10,8), material); s.position.set(...pts[i]); reg(s, tag, o);
  }
}
// скобы с шагом step вдоль ломаной
const clipGeo = new THREE.BoxGeometry(.05,.012,.06);
const clipPts = [];
function clips(pts, step, tag){
  for (let i=0;i<pts.length-1;i++){
    const A = new THREE.Vector3(...pts[i]), B = new THREE.Vector3(...pts[i+1]);
    const L = A.distanceTo(B), n = Math.floor(L/step);
    for (let k=1;k<=n;k++) clipPts.push({p:A.clone().lerp(B, k*step/L), dir:B.clone().sub(A).normalize(), tag});
  }
}
function label(text, pos, tag, o){ labels.push(Object.assign({text, pos:new THREE.Vector3(...pos), tag}, o||{})); }
function textTex(lines, bg, fg, w, h, size){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.fillStyle = bg; g.fillRect(0,0,w,h);
  g.fillStyle = fg; g.font = 'bold ' + size + 'px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  lines.forEach((t,i)=> g.fillText(t, w/2, h/2 + (i-(lines.length-1)/2)*size*1.15));
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
function stripeTex(){
  const c = document.createElement('canvas'); c.width = 64; c.height = 8;
  const g = c.getContext('2d'); g.fillStyle = '#e8c300'; g.fillRect(0,0,32,8); g.fillStyle = '#1f9a3a'; g.fillRect(32,0,32,8);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; return t;
}

// ---------------- константы ----------------
const FL = -3.58, CEIL = -0.4, CL = CEIL - 0.08;   // пол, потолок, уровень гофры по потолку
const CONC = 0xc9c5bc, WALLC = 0xd7d3cb;

// ---------------- грунт ----------------
(function(){
  const gm = mat(0x9c8463, {transparent:true, opacity:.28, depthWrite:false, side:THREE.DoubleSide});
  const g = new THREE.Mesh(new THREE.PlaneGeometry(70, 90), gm); g.rotation.x = -Math.PI/2; g.position.set(9, 0, -18);
  reg(g, null, {layer:'soil'});
  const grid = new THREE.GridHelper(70, 35, 0x8f7a5b, 0xa89474); grid.position.set(9, .002, -18);
  grid.material.transparent = true; grid.material.opacity = .25; reg(grid, null, {layer:'soil'});
})();

// ---------------- здание ----------------
const wallMat = mat(WALLC, {transparent:true, opacity:.55});
function wall(x1,z1,x2,z2,t,y0,y1){
  const w = Math.abs(x2-x1) || t, d = Math.abs(z2-z1) || t;
  box(w, y1-y0, d, (x1+x2)/2, (y0+y1)/2, (z1+z2)/2, WALLC, null, {material:wallMat});
}
// плита пола
box(19.2, .3, 15.4, 9.3, FL-.15, 7.5, CONC);
// основной блок x 7.75..18.6, z 2.1..12.7
wall(7.75,2.1,18.6,2.1,.3,FL,CEIL); wall(7.75,12.7,18.6,12.7,.3,FL,CEIL);
wall(18.6,2.1,18.6,12.7,.3,FL,CEIL);
wall(7.75,4.4,7.75,10.6,.3,FL,CEIL);
// перегородки
wall(13.1,2.1,13.1,6.8,.15,FL,CEIL); wall(13.1,7.8,13.1,12.7,.15,FL,CEIL); // проём в зал
wall(7.75,8.15,10.0,8.15,.15,FL,CEIL); wall(10.9,8.15,13.1,8.15,.15,FL,CEIL);
wall(10.0,8.15,10.0,11.0,.15,FL,CEIL);
// тамбуры 4 и 5
wall(5.5,2.1,7.75,2.1,.3,FL,CEIL); wall(5.5,4.4,7.75,4.4,.3,FL,CEIL);
wall(5.5,10.6,7.75,10.6,.3,FL,CEIL); wall(5.5,12.7,7.75,12.7,.3,FL,CEIL);
// лестничные марши
function stairs(z0,z1){
  const n = 16, run = 5.1/n, rise = -FL/n;
  for (let i=0;i<n;i++){
    const x = 5.5 - (i+.5)*run, h = (i+1)*rise;
    box(run, .18, z1-z0, x, FL + h - .09, (z0+z1)/2, 0xbdb8ae);
  }
  wall(0.4,z0-.15,5.5,z0-.15,.3,FL,0.9); wall(0.4,z1+.15,5.5,z1+.15,.3,FL,0.9);
}
stairs(0.5, 2.0); stairs(13.0, 14.5);
// входная стенка тамбуров (со стороны лестниц)
wall(5.5,0.35,5.5,2.1,.3,FL,CEIL); wall(5.5,12.7,5.5,14.65,.3,FL,CEIL);
// перекрытие
const roofMat = mat(0xb9b4aa, {transparent:true, opacity:.35, depthWrite:false});
[[13.17,7.4,10.85,10.6],[6.6,7.4,2.3,10.6]].forEach(([x,z,w,d])=>{
  const r = new THREE.Mesh(new THREE.BoxGeometry(w,.4,d), roofMat); r.position.set(x,CEIL+.2,z);
  reg(r, null, {layer:'roof'});
});
label('Помещение 1 · укрытие 50 чел.', [15.8, FL+.3, 9.2]);
label('Помещение 2 · вспомогательное', [10.3, FL+.3, 7.3]);
label('Тамбур', [6.6, FL+.3, 3.3]); label('Тамбур', [6.6, FL+.3, 11.7]);
label('Санузел', [11.5, FL+.3, 9.8]);
label('Отм. −3,580', [17.6, FL+.05, 12.2]);

// ---------------- Щиты ----------------
const WZ = 2.25 + .01; // внутренняя грань северной стены
function cabinet(tag, x, yb, w, h, d, color, text, textColor){
  box(w, h, d, x, yb+h/2, WZ+d/2, color, tag, {m:{metalness:.3, roughness:.5}});
  if (text){
    const t = textTex([text], textColor||'#ffffff', '#1b1f24', 256, 96, 52);
    const p = new THREE.Mesh(new THREE.PlaneGeometry(Math.min(w*.7,.34), Math.min(w*.7,.34)*.375), new THREE.MeshBasicMaterial({map:t}));
    p.position.set(x, yb+h-.12, WZ+d+.002); reg(p, tag);
  }
}
cabinet('vru', 8.65, FL+1.0, .6, .8, .3, 0xd9dde2, 'АВР', '#1f4e9a');
cabinet('shr', 9.55, FL+1.0, .6, 1.0, .3, 0xd9dde2, 'ШР');
cabinet('sho', 10.4, FL+1.0, .6, .6, .3, 0xd9dde2, 'ШО');
cabinet('shuv', 11.1, FL+1.55, .22, .275, .14, 0xf4f4f4, 'ЩУВ');
// АВР-надпись — синяя плашка
label('ВРУ с АВР', [8.65, FL+1.9, 2.6], 'vru');
label('ШР', [9.55, FL+2.1, 2.6], 'shr'); label('ШО', [10.4, FL+1.7, 2.6], 'sho'); label('ЩУВ', [11.1, FL+1.95, 2.45], 'shuv');

// ДЭС — шкаф на парапете входной группы
box(4.6, 1.0, .25, 3.0, .5, .2, WALLC, null, {material:wallMat});
box(.6, .4, .2, 1.6, .55, .02, 0xb7bec6, 'des', {m:{metalness:.35, roughness:.45}});
box(.14, .14, .12, 1.6, .55, -.14, 0x2a5fa8, 'des');
label('Шкаф ДЭС + вилка 63 А', [1.6, .95, 0], 'des');

// ---------------- Кабель-канал ----------------
const KK = 0xf2f2ef, kky = FL + .25;
box(4.7, .1, .05, 10.2, kky, WZ+.03, KK, 'kanal');
box(.1, CEIL-.35-kky, .05, 8.05, (kky+CEIL-.35)/2, WZ+.03, KK, 'kanal');
[8.65, 9.55, 10.4].forEach(x => box(.1, 1.0-.3, .05, x, FL+.65, WZ+.03, KK, 'kanal'));
label('Кабель-канал ПВХ 100×50', [9.7, kky+.15, 2.4], 'kanal');

// ---------------- Гильзы ввода ----------------
[[8.0,-.75],[8.15,-.75],[7.85,-.75]].forEach(([x,y]) => seg([x,y,1.75],[x,y,2.45], .03, 0x6f7780, 'sleeve', {m:{metalness:.6, roughness:.4}}));
label('Гильзы Ц-40 + огнезащита', [8.0, -.5, 1.9], 'sleeve');

// ---------------- Траншея и наружные кабели ----------------
const TX = 8.6, TZ0 = 1.6, TZ1 = -42.6, ROAD0 = -20, ROAD1 = -27.5;
const soilM = mat(0x8a6c48, {transparent:true, opacity:.22, depthWrite:false});
box(.7, .9, TZ0-TZ1, TX, -.45, (TZ0+TZ1)/2, 0, 'trench', {material:soilM});
// послойный разрез траншеи (участок 2 м)
const SZ = -9;
box(.7,.2,2, TX, -.8, SZ, 0xd8c08a, 'trench');           // постель
box(.7,.2,2, TX, -.6, SZ, 0xcbb07a, 'trench', {m:{transparent:true, opacity:.55}}); // засыпка просеянным
box(.7,.5,2, TX, -.25, SZ, 0x7a5c3c, 'trench', {m:{transparent:true, opacity:.35}}); // обратная засыпка
label('Разрез траншеи Т-6: 0,7 × 0,9 м', [TX, .25, SZ], 'trench');
label('постель 0,2 · засыпка 0,2 · обратная засыпка 0,5', [TX+1.6, -.6, SZ], 'trench');
// сигнальная лента
box(.2, .005, TZ0-TZ1, TX, -.45, (TZ0+TZ1)/2, 0xd8352a, 'trench');
label('Сигнальная лента 200 мм', [TX, -.42, -14], 'trench');
// кабели ВБШв 5×35 (2 линии)
const kab = [];
[-.12, .12].forEach((dx, i) => {
  const x = TX + dx, y = -.68;
  const pts = [[x, -.72, 1.7], [x, y, -.5], [x, y, ROAD0+1], [x, -1.0, ROAD0], [x, -1.0, ROAD1], [x, y, ROAD1-1], [x, y, -40.8], [x, -.68, -41.6+0], ];
  kab.push(pts);
  poly(pts, .022, 0x1d1f22, 'k535');
  // в стене — к гильзе и в канал
  poly([[x, -.72, 1.7],[x-.0, -.75, 1.75],[8.0+dx*.6, -.75, 1.75]], .022, 0x1d1f22, 'k535');
  poly([[8.0+dx*.6, -.75, 2.45],[8.05, CEIL-.4, 2.3],[8.05, kky, 2.3],[8.65+dx, kky, 2.3],[8.65+dx, FL+1.0, 2.35]], .02, 0x1d1f22, 'k535');
});

const HL = new THREE.Color(0xff7a00);
function setHL(tag, on){
  (tagMeshes[tag]||[]).forEach(m => {
    const mats = Array.isArray(m.material) ? m.material : [m.material];
    mats.forEach(mt => {
      if (!mt.emissive) return;
      if (on){ if (!mt.userData.e0){ mt.userData.e0 = mt.emissive.clone(); mt.userData.ei = mt.emissiveIntensity; } mt.emissive.copy(HL); mt.emissiveIntensity = .35; }
      else if (mt.userData.e0){ mt.emissive.copy(mt.userData.e0); mt.emissiveIntensity = mt.userData.ei; }
    });
  });
}

function goTo(v){

function select(id, move){
  if (selected) setHL(selected, false);

  document.querySelectorAll('.item').forEach(e => e.classList.toggle('on', e.dataset.id === id));

  if (!id){ card.classList.remove('on'); resize(); return; }

    '<h2>' + esc(it.name) + '</h2>' +
    '<div class="meta"><span class="chip">Объём: ' + esc(it.qty) + '</span><span class="chip">СО: ' + esc(it.so) + '</span><span class="chip">ВР: ' + esc(it.vr) + '</span><span class="chip">Этап ' + it.stage + ' · ' + esc(stage.name) + '</span></div>' +

    (it.add ? '<div class="blk a"><h3>Предлагаем дополнительно (в проекте нет)</h3>' + list(it.add) + '</div>' : '') +

  '<p><b>Основание:</b> рабочая документация ' + esc(M.code) + ' (' + esc(M.designer) + '): листы 1–11, спецификация 3069-ЭС.СО, ведомость объёмов работ 3069-ЭС.ВР, опросные листы ОЛ1–ОЛ3.</p>' +
  '<p><b>Система:</b> 380/220 В, TN-S (ГОСТ 30331.1-2013), I категория надёжности, два независимых ввода от ЩСУ-2 через АВР.</p>' +
  '<p><b>Условности схемы:</b> геометрия построена по планам листов 7–11. Трасса 215 м и переход под дорогой показаны сокращённо. Диаметры кабелей и труб увеличены, чтобы их было видно.</p>' +
  '<p><b>Цвета в карточке:</b> синий блок — как в проекте; оранжевый — что предлагаем дополнительно, потому что в проекте этого нет; красный — вопрос к заказчику.</p>' +
  '<p><b>Акты освидетельствования скрытых работ:</b></p><ul>' + D.hiddenWorks.map(h => '<li>' + esc(h) + '</li>').join('') + '</ul>' +
  '<p><b>Контакты:</b> ' + esc(M.contractor) + ', ' + esc(M.phone) + ', ' + esc(M.email) + '</p>';
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === b.dataset.p));
});

// ---------------- нижняя панель ----------------
document.querySelectorAll('#views button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#views button').forEach(x => x.classList.toggle('on', x === b));
  goTo(b.dataset.v);
});
const stSeg = document.getElementById('stagesSeg');
let maxStage = 7;
D.stages.forEach(s => {
  const b = document.createElement('button'); b.textContent = s.n; b.title = s.name + ': ' + s.hint;
  if (s.n === 7) b.classList.add('on');
  b.onclick = () => { maxStage = s.n; stSeg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); applyStage(); };
  stSeg.appendChild(b);
});
function applyStage(){
  Object.keys(tagMeshes).forEach(t => (tagMeshes[t]||[]).forEach(m => m.visible = (stageOf[t]||0) <= maxStage && layerVisible(m)));
}
const layerOn = {soil:true, roof:true, labels:true};
function layerVisible(m){ return !((layer.soil.includes(m) && !layerOn.soil) || (layer.roof.includes(m) && !layerOn.roof)); }
document.querySelectorAll('#layers button').forEach(b => b.onclick = () => {
  const l = b.dataset.l; layerOn[l] = !layerOn[l]; b.classList.toggle('on', layerOn[l]);
  if (l !== 'labels') layer[l].forEach(m => m.visible = layerOn[l]);
});

// ---------------- подписи ----------------
const lbBox = document.getElementById('labels');
labels.forEach(l => { l.el = document.createElement('div'); l.el.className = 'lb'; l.el.textContent = l.text; lbBox.appendChild(l.el); });
const v3 = new THREE.Vector3();
function placeLabels(w, h){
  labels.forEach(l => {
    const vis = layerOn.labels && (!l.tag || (stageOf[l.tag]||0) <= maxStage);
    v3.copy(l.pos).project(camera);
    const d = camera.position.distanceTo(l.pos);
    const show = vis && !(l.out && camera.position.y < 0) && (!window.__onlySel || l.tag === selected || (window.__also||[]).includes(l.tag)) && v3.z < 1 && Math.abs(v3.x) < 1.05 && Math.abs(v3.y) < 1.05 && (d < (l.tag ? 14 : 40) || l.tag === selected);
    l.el.style.display = show ? 'block' : 'none';
    if (show){ l.el.style.left = ((v3.x+1)/2*w) + 'px'; l.el.style.top = ((1-v3.y)/2*h) + 'px'; l.el.classList.toggle('sel', !!l.tag && l.tag === selected); }
  });
}

// ---------------- клик и подсказка ----------------
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = document.getElementById('tip');
let down = null;
function pick(e){
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set((e.clientX-r.left)/r.width*2-1, -(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(pickables.filter(m => m.visible), false)[0];
  return hit ? hit.object.userData.tag : null;
}
renderer.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX-down[0], e.clientY-down[1]) > 5) return;
  const t = pick(e); select(t, false);
});
renderer.domElement.addEventListener('pointermove', e => {
  if (e.buttons) { tip.style.display = 'none'; return; }
  const t = pick(e);
  if (t){ const r = view.getBoundingClientRect(); tip.textContent = byId[t].name; tip.style.display = 'block'; tip.style.left = (e.clientX-r.left+14)+'px'; tip.style.top = (e.clientY-r.top+10)+'px'; renderer.domElement.style.cursor = 'pointer'; }
  else { tip.style.display = 'none'; renderer.domElement.style.cursor = ''; }
});

// ---------------- цикл ----------------
function resize(){
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h); camera.aspect = w/h;
  // при открытой карточке смещаем центр кадра влево, чтобы объект не прятался под ней
  const off = (document.getElementById('card').classList.contains('on') && w > 900) ? 200 : 0;
  if (off){ camera.aspect = (w + off*2)/h; camera.setViewOffset(w + off*2, h, off*2, 0, w, h); } else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();
camera.position.set(...views.all.p); controls.target.set(...views.all.t);
function loop(t){
  if (window.__paused){ requestAnimationFrame(loop); return; }
  if (fly){
    let k = Math.min(1, (performance.now()-fly.s)/900); k = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(fly.p0, fly.p1, k); controls.target.lerpVectors(fly.t0, fly.t1, k);
    if (k >= 1) fly = null;
  }
  if (selected){ const s = .22 + .18*Math.sin(t/220); (tagMeshes[selected]||[]).forEach(m => { const mt = m.material; if (mt && mt.emissive && mt.userData.e0) mt.emissiveIntensity = s; }); }
  controls.update(); renderer.render(scene, camera);
  placeLabels(view.clientWidth, view.clientHeight);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// для скриншотов отчёта
window.__sulak = {focus, views,
  frame:(p,t,cap)=>{ camera.position.set(...p); controls.target.set(...t); camera.lookAt(controls.target); camera.updateMatrixWorld(); renderer.render(scene,camera); placeLabels(view.clientWidth, view.clientHeight);
    const c = document.getElementById('cap'); if (cap){ c.hidden=false; c.querySelector('.ct').textContent=cap[0]; c.querySelector('.c1').textContent=cap[1]||''; c.querySelector('.c2').textContent=cap[2]||''; c.querySelector('.c3').textContent=cap[3]||''; } else c.hidden=true; },
  hl:(tag)=>{ select(tag||null,false); document.getElementById('card').classList.remove('on'); resize(); },
  shot:(v,tag)=>{ const o = views[v] || focus[v]; camera.position.set(...o.p); controls.target.set(...o.t); controls.update(); select(tag||null,false); document.getElementById('card').classList.remove('on'); resize(); }, goTo: v => { const o = views[v] || focus[v]; camera.position.set(...o.p); controls.target.set(...o.t); controls.update(); }, select, layerOn, layer,
  setLayer:(l,on)=>{ layerOn[l]=on; if(l!=='labels') layer[l].forEach(m=>m.visible=on); }};
})();
</script>
</body>
